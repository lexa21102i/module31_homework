<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kanban Board</title>
</head>
<body>
  <nav class="topbar">
    <h1 class="topbar__title">Kanban Board</h1>
    <div id="app-header" class="topbar__right"></div>
    <form id="app-login-form" class="topbar__login">
      <input class="topbar__input" name="login" type="text" placeholder="Login" required>
      <input class="topbar__input" name="password" type="password" placeholder="Password" required>
      <button id="app-login-btn" class="topbar__btn" type="submit">Sign In</button>
    </form>
  </nav>

  <main id="content" class="content">
    <p>Please Sign In to see your tasks!</p>
  </main>

  <footer id="app-footer" class="footer"></footer>
</body>
</html>
